name: Watch CIDE menu

# First 3 and last 3 days of each month, every morning: does the school page link a menu PDF the site doesn't have? (Link only: cide.es blocks GitHub
# runners after one request, so the PDF itself is downloaded later by /update-menu on the Mac.) If so, open an issue (assigned to Guille) asking to
# run /update-menu in Claude Code. No API key here: Claude reads the PDF on Guille's Mac.
on:
  schedule:
    # 06:00 CET / 07:00 CEST on days 1-3 and 26-31; the "Month edges only" step skips 26-28 when they aren't among
    # the last 3 days (cron can't say "last 3 days"). New menus come out around the turn of the month.
    - cron: '0 5 1-3,26-31 * *'
  workflow_dispatch:
    inputs:
      pretend_new:
        description: 'Test: treat the current PDF as new (opens a [test] issue)'
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: watch-menu
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Month edges only
        id: edge
        run: |
          if [ "${{ github.event_name }}" != schedule ] || [ "$(date -u +%-d)" -le 3 ] || [ "$(date -u -d '+3 days' +%-d)" -le 3 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Not one of the first or last 3 days of the month: nothing to do."
          fi
      - uses: actions/checkout@v4
        if: steps.edge.outputs.run
      - uses: actions/setup-node@v4
        if: steps.edge.outputs.run
        with:
          node-version: 22
      - name: Check the menu PDF
        if: steps.edge.outputs.run
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/watch-menu.mjs ${{ inputs.pretend_new && '--pretend-new' || '' }}
      - name: Diagnose the connection to cide.es
        if: failure()
        run: |
          for u in https://www.cide.es/ https://www.cide.es/espai-migdia-menjadors/; do
            curl -sS -o /dev/null --max-time 40 -A 'menu-mellis' \
              -w "$u → %{http_code} ip=%{remote_ip} connect=%{time_connect}s tls=%{time_appconnect}s first-byte=%{time_starttransfer}s total=%{time_total}s\n" "$u" || true
          done
