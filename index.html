<!doctype html>
<html lang="ca">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#ffe9f5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1a1530" media="(prefers-color-scheme: dark)">
  <title>Menú Mellis</title>
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-title" content="Menú Mellis">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400..700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <span class="brand"><span>Menú <b>Mellis</b></span></span>
    <div class="langs" role="group" aria-label="Language">
      <button data-lang="ca">CA</button><button data-lang="es">ES</button><button data-lang="en">EN</button>
    </div>
  </header>

  <nav class="daybar">
    <button class="arrow" id="prev" aria-label="Previous day">‹</button>
    <div class="daytitle">
      <span class="rel" id="rel"></span>
      <span class="date" id="date"></span>
    </div>
    <button class="arrow" id="next" aria-label="Next day">›</button>
  </nav>

  <main id="day" aria-live="polite"></main>

  <footer class="foot" id="foot"></footer>

  <div class="install" id="install" hidden>
    <button class="btn install-btn" id="installBtn" type="button"></button>
    <p class="install-help" id="installHelp" hidden></p>
  </div>

  <script src="app.js"></script>
</body>
</html>
